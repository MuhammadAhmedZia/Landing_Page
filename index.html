<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="homepage">
        <!-- Header -->
        <div class="header">
            <div class="header-logo">
                <p><a href="#">SYBRO</a></p>
            </div>

            <div class="header-links">
                <a href="#">Services</a>
                <a href="#">About</a>
                <a href="#">Contact Us</a>
            </div>

        </div>

        <!-- Hero -->
        <div class="hero">
            <div class="hero-left">
                <div class="hero-heading">
                    <B>SYBRO</B>
                </div>
                <div class="hero-content">
                    <p>This website has some subtext that goes here under the main title. it's a smaller font and
                        the color is lower contrast.</p>
                </div>
                <div class="hero-signup-button">
                    <button>Sign up</button>
                </div>
            </div>
            <div class="hero-right">
                <img src="security.webp" alt="" class="right-img">
            </div>
        </div>
    </div>
</body>

</html>
